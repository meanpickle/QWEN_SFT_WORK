lora_dropout: 0.05
lora_target: all
dataset_dir: data
dataset: tulu3_random_10000
template: qwen
cutoff_len: 2048
train_on_prompt: false
mask_history: false
packing: false
preprocessing_num_workers: 2
dataloader_num_workers: 0
