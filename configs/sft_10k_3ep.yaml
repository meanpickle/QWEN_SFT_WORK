learning_rate: 0.0001
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
flash_attn: sdpa
optim: adamw_torch
seed: 42
data_seed: 42
logging_steps: 5
save_strategy: epoch
save_total_limit: 2
plot_loss: true
report_to: none
output_dir: outputs/sft_10k_3ep
overwrite_output_dir: false
